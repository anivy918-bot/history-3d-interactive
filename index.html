<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>穿越历史 · 3D互动历史馆</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <header class="topbar">
      <div>
        <div class="eyebrow">HISTORY · 3D INTERACTIVE MUSEUM</div>
        <h1>穿越历史</h1>
        <p>中国古代文明 3D 互动历史馆</p>
      </div>
      <button id="teacherMode" class="ghost-btn">教师课堂模式：关</button>
    </header>

    <aside class="timeline">
      <div class="panel-title">历史时间轴</div>
      <div id="timeline"></div>
    </aside>

    <section class="info-card" id="infoCard">
      <div class="card-kicker">当前探索</div>
      <h2 id="sceneTitle">秦 · 咸阳</h2>
      <p id="sceneDesc">选择时间轴或点击场景中的对象，开始探索。</p>
      <div class="facts" id="facts"></div>
    </section>

    <section class="quiz" id="quiz">
      <div class="quiz-head">
        <span>历史挑战</span>
        <button id="closeQuiz">×</button>
      </div>
      <h3 id="question">秦统一六国发生在哪一年？</h3>
      <div id="options"></div>
      <div id="result"></div>
    </section>

    <div class="bottom-hint">
      <span>🖱 拖动旋转</span>
      <span>滚轮缩放</span>
      <span>点击建筑 / 人物 / 文物查看知识</span>
      <button id="quizBtn" class="primary-btn">开始历史问答</button>
    </div>

    <div class="loading" id="loading">
      <div class="loader"></div>
      <div>正在打开历史时空……</div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
